repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: clear-notebook-outputs
        name: Clear outputs from .ipynb notebooks
        entry: pwsh scripts/clear_notebook_outputs.ps1
        language: system
        types: [jupyter]
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]

      - id: ruff-format

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: pyright
        language: node
        pass_filenames: false
        types_or: [python, pyi]
        stages: [manual]
        additional_dependencies: &pyright_dependencies
          - pyright@1.1.414

      - id: pyright-general-type-issues
        name: pyright reportGeneralTypeIssues
        entry: pyright -p pyright_reportGeneralTypeIssues.json --level warning
        language: node
        pass_filenames: false
        types_or: [python, pyi]
        stages: [manual]
        additional_dependencies: *pyright_dependencies

      - id: mypy
        name: mypy
        entry: mypy
        language: system
        pass_filenames: false
        types_or: [python, pyi]
        stages: [manual]
